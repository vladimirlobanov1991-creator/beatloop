<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15171c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>BeatLoop</title><style>
*{box-sizing:border-box}body{margin:0;background:#15171c;color:#f5f5f5;font:16px system-ui}header,section,footer{padding:14px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0;color:#b9f66d}button,select,input{font:inherit}button,select,.file{background:#30343d;color:white;border:0;border-radius:10px;padding:12px;min-height:44px}button.active,#play{background:#b9f66d;color:#15171c}button:disabled{opacity:.4}input[type=range]{accent-color:#b9f66d;width:100%}input[type=number]{width:75px;background:#30343d;color:white;border:0;padding:10px;border-radius:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{background:#20232a;border-radius:14px;margin:8px 12px;padding:12px}#score{background:white;color:black;min-height:180px;overflow:hidden}#status{color:#b5bac5;font-size:13px}#song{font-weight:700;font-size:20px}footer{position:sticky;bottom:0;background:#15171c;padding-bottom:calc(12px + env(safe-area-inset-bottom))}#play{flex:1;font-weight:bold}.at-cursor-bar{background:#fff0a0;opacity:.45}.at-cursor-beat{background:#e48100;width:3px}.at-highlight *{fill:#d16b00;stroke:#d16b00}.at-selection div{background:#b9f66d55}small{color:#b5bac5}#library{width:100%}label{display:inline-block}details summary{cursor:pointer;padding:8px 0}
#score{position:relative;z-index:0;isolation:isolate}footer{z-index:1000;isolation:isolate;background:#15171c;box-shadow:0 -4px 16px #0005}body{padding-bottom:env(safe-area-inset-bottom)}#play:disabled{opacity:1;background:#41454b;color:#b5bac5}
#pickHint{display:block;margin-bottom:6px}footer .row{flex-wrap:nowrap}footer button{padding:10px;min-width:40px}#play{min-width:0} @media(max-width:380px){footer .row{gap:4px}footer button{padding:7px;font-size:13px}}
</style><script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.6.3/dist/alphaTab.min.js"></script></head><body><header><h1>BEAT / LOOP</h1><label class="file">＋ Файл<input id="file" type="file" accept=".gp,.gp3,.gp4,.gp5,.gpx,.gp6,.gp7,.musicxml,.xml" hidden></label></header><section class="panel"><div id="song">Выбери композицию</div><p id="status">Загрузка движка…</p><div class="row"><select id="library"><option value="">Моя библиотека</option></select><button id="remove">Удалить</button></div><div class="row" style="margin-top:8px"><select id="track" style="flex:1"><option>Дорожка</option></select><button id="demo">Демо</button></div></section><section class="panel"><div class="row"><strong>Темп</strong><strong id="speedLabel">100%</strong><small id="bpm"></small></div><input id="speed" type="range" min="10" max="200" step="1" value="100"><div class="row" id="presets"><button>50%</button><button>75%</button><button>90%</button><button>100%</button></div></section><section class="panel"><div class="row"><strong>Цикл</strong><input id="from" type="number" min="1" value="1" aria-label="Первый такт"><span>→</span><input id="to" type="number" min="1" value="4" aria-label="Последний такт"><button id="loop">Вкл.</button></div><small>Номера тактов включительно. Можно выбрать диапазон прямо на нотах кнопкой 🔁.</small><details><summary>Тренировка темпа</summary><div class="row"><label><input type="checkbox" id="trainer"> Ускорять</label><label>+ <input type="number" id="step" min="1" max="30" value="5"> BPM</label><label>каждые <input type="number" id="every" min="1" max="99" value="4"> циклов</label></div><small id="cycles">Повторы: 0</small></details></section><div id="score"></div><section class="panel"><details><summary>Микшер</summary><div id="mixer"></div></details></section><footer><small id="pickHint" aria-live="polite">Нажми 🔁, чтобы выбрать такты на нотах</small><div class="row"><button id="stop" disabled>■</button><button id="play" disabled>Загрузка звука…</button><button id="pick" aria-label="Выбрать цикл на нотах" aria-pressed="false">🔁</button><button id="metro">Метр.</button><button id="count" class="active">Отсчёт</button></div></footer><script src="app.js?v=013"></script></body></html>
